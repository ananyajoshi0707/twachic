{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skin Analyzer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-image: url("{% static 'skin_app/img.jpg' %}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .container {
            max-width: 500px;
            margin: 50px auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .form-control {
            margin-top: 10px;
        }
        .btn-upload {
            width: 100%;
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            font-size: 16px;
        }
        .btn-upload:hover {
            background-color: #0056b3;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background: #e9f5e9;
            border-radius: 5px;
            position: relative; /* Added for positioning the close button */
        }
        .result p {
            margin: 0;
        }
        /* Style for the close button */
        .close-button {
            position: absolute;
            top: 5px;
            right: 10px;
            font-size: 1.5rem;
            color: #aaa;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
        }
        .close-button:hover {
            color: #333;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Upload a Skin Image</h2>
    <form method="POST" enctype="multipart/form-data" id="uploadForm">
        {% csrf_token %}
        <input type="file" name="image" class="form-control" id="imageInput" required>
        <button type="submit" class="btn btn-upload">Upload</button>
        <p>File should be an image (.jpg, .png format)</p>
    </form>

    {% if uploaded_file_url %}
    <div class="result" id="analysisResult">
        <button class="close-button" id="cancelUpload">&times;</button>
        <p><strong>Image uploaded successfully!</strong> <a href="{{ uploaded_file_url }}" target="_blank">View Image</a></p>
        <h3 class="mt-3">AI Analysis Result:</h3>
        <p>{{ analysis_result.insights|safe }}</p>
    </div>
    {% endif %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const cancelUploadButton = document.getElementById('cancelUpload');
        const imageInput = document.getElementById('imageInput');
        const analysisResultDiv = document.getElementById('analysisResult');

        if (cancelUploadButton) {
            cancelUploadButton.addEventListener('click', function() {
                // Clear the file input
                imageInput.value = '';

                // Hide the result section
                if (analysisResultDiv) {
                    analysisResultDiv.style.display = 'none';
                }

               
            });
        }
    });
</script>
</body>
</html>
